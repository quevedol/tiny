# Tiny Tapeout project information
project:
  title:        "SERV TinyML SoC"      # Project title
  author:       "quevedol"      # GitHub username; replace with a public name if desired
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "RV32I SERV SoC with INT8 MAC, external SPI Flash boot and PSRAM data memory"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "3x2"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_quevedol_serv_tinyml"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "accel/mac_int8.v"
    - "accel/mac_mmio.v"
    - "mem/spi_flash_read.v"
    - "mem/spi_mem_ctrl.v"
    - "mem/spi_mem_bridge.v"
    - "periph/uart_tx.v"
    - "tech/sky130_clock_gate.v"
    - "soc/serv_soc.v"
    - "soc/serv_extmem_soc.v"
    - "cpu/serv_cpu.v"
    - "cpu/serv/serv_bufreg.v"
    - "cpu/serv/serv_bufreg2.v"
    - "cpu/serv/serv_alu.v"
    - "cpu/serv/serv_csr.v"
    - "cpu/serv/serv_ctrl.v"
    - "cpu/serv/serv_decode.v"
    - "cpu/serv/serv_immdec.v"
    - "cpu/serv/serv_mem_if.v"
    - "cpu/serv/serv_rf_if.v"
    - "cpu/serv/serv_rf_ram_if.v"
    - "cpu/serv/serv_rf_ram.v"
    - "cpu/serv/serv_state.v"
    - "cpu/serv/serv_debug.v"
    - "cpu/serv/serv_top.v"
    - "cpu/serv/serv_rf_top.v"
    - "cpu/serv/serv_aligner.v"
    - "cpu/serv/serv_compdec.v"
    - "cpu/serv/serv_synth_wrapper.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Unused"
  ui[1]: "Unused"
  ui[2]: "Unused"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "UART TX"
  uo[1]: "MAC result bit 0"
  uo[2]: "MAC result bit 1"
  uo[3]: "MAC result bit 2"
  uo[4]: "MAC result bit 3"
  uo[5]: "MAC done"
  uo[6]: "MAC overflow"
  uo[7]: "CPU active"

  # Bidirectional pins
  uio[0]: "SPI Flash CS"
  uio[1]: "SPI MOSI"
  uio[2]: "SPI MISO"
  uio[3]: "SPI SCLK"
  uio[4]: "Reserved QSPI SD2 (tri-stated)"
  uio[5]: "Reserved QSPI SD3 (tri-stated)"
  uio[6]: "SPI PSRAM A CS"
  uio[7]: "Reserved PSRAM B CS (held high)"

# Do not change!
yaml_version: 6
